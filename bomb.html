<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            touch-action: manipulation;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status.idle {
            background: #333;
            color: #888;
        }

        .status.armed {
            background: #ff3333;
            color: white;
            animation: pulse 1s infinite;
        }

        .status.exploded {
            background: #ff6600;
            color: white;
            animation: shake 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            75% { transform: translateX(10px) rotate(2deg); }
        }

        .timer-input {
            margin-bottom: 30px;
        }

        .timer-input label {
            display: block;
            color: #999;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .timer-input input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        .timer-input input:focus {
            outline: none;
            border-color: #ff3333;
        }

        button {
            width: 100%;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .start-btn {
            background: #ff3333;
            color: white;
        }

        .start-btn:disabled {
            background: #444;
            color: #666;
            cursor: not-allowed;
        }

        .stop-btn {
            background: #444;
            color: white;
        }

        .reset-btn {
            background: #666;
            color: white;
        }

        .hidden {
            display: none;
        }

        .bomb-emoji {
            font-size: 120px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status idle" id="status">Disarmed</div>
        
        <div class="bomb-emoji" id="emoji">💣</div>

        <div class="timer-input" id="inputSection">
            <label for="seconds">Timer (seconds):</label>
            <input type="number" id="seconds" min="1" max="600" value="60">
        </div>

        <button class="start-btn" id="startBtn">Arm Bomb</button>
        <button class="stop-btn hidden" id="stopBtn">Disarm</button>
        <button class="reset-btn hidden" id="resetBtn">Reset</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const emojiEl = document.getElementById('emoji');
        const secondsInput = document.getElementById('seconds');
        const inputSection = document.getElementById('inputSection');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');

        let timer = null;
        let endTime = null;
        let tickAudio = null;
        let explosionAudio = null;

        // Create audio contexts
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // Generate ticking sound
        function createTickSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

        // Generate explosion sound
        function createExplosionSound() {
            const duration = 1.5;
            const now = audioCtx.currentTime;
            
            // Bass boom
            const bass = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bass.connect(bassGain);
            bassGain.connect(audioCtx.destination);
            bass.frequency.setValueAtTime(100, now);
            bass.frequency.exponentialRampToValueAtTime(20, now + duration);
            bassGain.gain.setValueAtTime(0.8, now);
            bassGain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            bass.start(now);
            bass.stop(now + duration);
            
            // Noise
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            const noiseGain = audioCtx.createGain();
            const noiseFilter = audioCtx.createBiquadFilter();
            
            noise.buffer = buffer;
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(5000, now);
            noiseFilter.frequency.exponentialRampToValueAtTime(100, now + duration);
            
            noiseGain.gain.setValueAtTime(0.5, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            noise.start(now);
        }

        function startBomb() {
            const seconds = parseInt(secondsInput.value);
            if (seconds < 1) return;

            // Resume audio context on user interaction
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            endTime = Date.now() + (seconds * 1000);
            
            statusEl.textContent = 'Armed';
            statusEl.className = 'status armed';
            emojiEl.textContent = '💣';
            
            inputSection.classList.add('hidden');
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            
            tick();
        }

        function tick() {
            const remaining = endTime - Date.now();
            
            if (remaining <= 0) {
                explode();
                return;
            }
            
            createTickSound();
            timer = setTimeout(tick, 1000);
        }

        function explode() {
            clearTimeout(timer);
            timer = null;
            
            statusEl.textContent = '💥 Exploded! 💥';
            statusEl.className = 'status exploded';
            emojiEl.textContent = '💥';
            
            stopBtn.classList.add('hidden');
            resetBtn.classList.remove('hidden');
            
            createExplosionSound();
        }

        function stopBomb() {
            clearTimeout(timer);
            timer = null;
            
            statusEl.textContent = 'Disarmed';
            statusEl.className = 'status idle';
            emojiEl.textContent = '💣';
            
            inputSection.classList.remove('hidden');
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
        }

        function reset() {
            clearTimeout(timer);
            timer = null;
            
            statusEl.textContent = 'Disarmed';
            statusEl.className = 'status idle';
            emojiEl.textContent = '💣';
            
            inputSection.classList.remove('hidden');
            startBtn.classList.remove('hidden');
            resetBtn.classList.add('hidden');
        }

        startBtn.addEventListener('click', startBomb);
        stopBtn.addEventListener('click', stopBomb);
        resetBtn.addEventListener('click', reset);

        // Allow Enter key to start
        secondsInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startBomb();
            }
        });
    </script>
</body>
</html>
