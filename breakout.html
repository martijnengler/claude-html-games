<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            font-family: 'Orbitron', Arial, sans-serif;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: #ff1493;
            text-shadow: 0 0 20px #ff1493, 0 0 40px #00ffff;
            font-size: 48px;
            letter-spacing: 4px;
        }

        canvas {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0033 100%);
            border: 3px solid #00ffff;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(255, 20, 147, 0.1);
            display: block;
        }

        #score {
            color: #00ffff;
            font-size: 32px;
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 3px;
        }

        #lives {
            color: #ff1493;
            font-size: 24px;
            text-shadow: 0 0 10px #ff1493;
            letter-spacing: 2px;
        }

        #instructions {
            color: rgba(0, 255, 255, 0.9);
            text-align: center;
            font-size: 14px;
            max-width: 600px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        #instructions p {
            margin: 5px 0;
        }

        button {
            padding: 12px 32px;
            font-size: 16px;
            background: linear-gradient(135deg, #ff1493 0%, #ff006e 100%);
            color: white;
            border: 2px solid #ff1493;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 20, 147, 0.5);
        }

        button:hover {
            box-shadow: 0 0 20px #ff1493;
            transform: translateY(-2px);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .mode-selector {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .mode-modal {
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.4);
            text-align: center;
            max-width: 500px;
            border: 3px solid #00ffff;
        }

        .mode-modal h2 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #ff1493;
            text-shadow: 0 0 20px #ff1493;
            letter-spacing: 2px;
        }

        .mode-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .mode-btn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #00ffff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mode-btn-1p {
            background: #ff1493;
            color: white;
        }

        .mode-btn-1p:hover {
            background: #ff006e;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.6);
            transform: translateY(-2px);
        }

        .mode-btn-2p {
            background: #00ffff;
            color: #1a0033;
        }

        .mode-btn-2p:hover {
            background: #00ffaa;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .mode-selector.hidden {
            display: none;
        }

        .mode-label {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .mode-modal {
                padding: 30px 20px;
            }

            .mode-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="mode-selector" id="modeSelector">
        <div class="mode-modal">
            <h2>Choose Game Mode</h2>
            <div class="mode-buttons">
                <button class="mode-btn mode-btn-1p" id="mode1p">
                    1 Player
                    <span class="mode-label">vs Breakout</span>
                </button>
                <button class="mode-btn mode-btn-2p" id="mode2p">
                    2 Players
                    <span class="mode-label">Local Multiplayer</span>
                </button>
            </div>
        </div>
    </div>

    <div id="gameContainer">
        <h1>🧱 BREAKOUT 🧱</h1>
        <div id="score">Score: <span id="scoreValue">0</span></div>
        <div id="lives">Lives: <span id="livesValue">3</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">
            <p id="instructionsMain">Use <strong>A/D</strong> or <strong>LEFT/RIGHT</strong> arrows to move your paddle</p>
            <p id="gameStatus">Game Started!</p>
        </div>
        <div class="controls">
            <button id="resetBtn">Reset Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 25,
            width: 100,
            height: 15,
            speed: 7,
            score: 0
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            dx: 4,
            dy: -4,
            size: 8,
            speed: 4
        };

        // Bricks grid
        const brickRows = 6;
        const brickCols = 10;
        const brickWidth = (canvas.width - 40) / brickCols;
        const brickHeight = 20;
        const brickPadding = 5;
        const bricks = [];

        function initBricks() {
            for (let row = 0; row < brickRows; row++) {
                bricks[row] = [];
                for (let col = 0; col < brickCols; col++) {
                    bricks[row][col] = {
                        x: col * (brickWidth + brickPadding) + 20,
                        y: row * (brickHeight + brickPadding) + 40,
                        width: brickWidth,
                        height: brickHeight,
                        status: 1,
                        color: `hsl(${(row * 60) % 360}, 100%, 50%)`
                    };
                }
            }
        }

        let gameActive = true;
        let keys = {};
        let lives = 3;
        let gameMode = null; // '1p' or '2p'
        let paddle2 = null;

        // Mode selection
        document.getElementById('mode1p').addEventListener('click', () => {
            gameMode = '1p';
            document.getElementById('modeSelector').classList.add('hidden');
            document.getElementById('instructionsMain').innerHTML = 'Use <strong>A/D</strong> or <strong>LEFT/RIGHT</strong> arrows to move your paddle';
            startGame();
        });

        document.getElementById('mode2p').addEventListener('click', () => {
            gameMode = '2p';
            document.getElementById('modeSelector').classList.add('hidden');
            document.getElementById('instructionsMain').innerHTML = 'P1: <strong>A/D</strong> &nbsp;|&nbsp; P2: <strong>LEFT/RIGHT</strong> arrows';
            // Initialize second paddle
            paddle2 = {
                x: canvas.width / 2 - 50,
                y: 25,
                width: 100,
                height: 15,
                speed: 7,
                score: 0
            };
            startGame();
        });

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        document.getElementById('resetBtn').addEventListener('click', resetGame);

        function startGame() {
            paddle.score = 0;
            if (paddle2) paddle2.score = 0;
            lives = 3;
            initBricks();
            gameActive = true;
            updateUI();
            document.getElementById('gameStatus').textContent = 'Game Started!';
        }

        function resetGame() {
            paddle.score = 0;
            if (paddle2) paddle2.score = 0;
            lives = 3;
            initBricks();
            gameActive = true;
            updateUI();
            document.getElementById('gameStatus').textContent = 'Game Started!';
        }

        function updateUI() {
            document.getElementById('scoreValue').textContent = paddle.score;
            document.getElementById('livesValue').textContent = lives;
        }

        function update() {
            if (!gameActive) return;

            // Paddle 1 movement
            if ((keys['a'] || keys['A'] || keys['ArrowLeft']) && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
            if ((keys['d'] || keys['D'] || keys['ArrowRight']) && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            }

            // Paddle 2 movement (2P mode)
            if (paddle2) {
                if ((keys['a'] || keys['A']) && paddle2.x > 0) {
                    paddle2.x -= paddle2.speed;
                }
                if ((keys['d'] || keys['D']) && paddle2.x < canvas.width - paddle2.width) {
                    paddle2.x += paddle2.speed;
                }
            }

            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with top/bottom walls
            if (ball.y - ball.size < 0) {
                ball.dy = -ball.dy;
                ball.y = ball.size;
            }
            if (ball.y - ball.size > canvas.height) {
                lives--;
                updateUI();
                if (lives <= 0) {
                    gameActive = false;
                    document.getElementById('gameStatus').textContent = 'Game Over! Final Score: ' + paddle.score;
                } else {
                    resetBall();
                }
                return;
            }

            // Ball collision with left/right walls
            if (ball.x - ball.size < 0 || ball.x + ball.size > canvas.width) {
                ball.dx = -ball.dx;
                ball.x = Math.max(ball.size, Math.min(canvas.width - ball.size, ball.x));
            }

            // Ball collision with paddle 1
            if (
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width &&
                ball.y > paddle.y &&
                ball.y < paddle.y + paddle.height &&
                ball.dy > 0
            ) {
                ball.dy = -ball.dy;
                ball.y = paddle.y - ball.size;
                const hitPos = (ball.x - paddle.x) / paddle.width - 0.5;
                ball.dx += hitPos * 3;
            }

            // Ball collision with paddle 2
            if (paddle2 &&
                ball.x > paddle2.x &&
                ball.x < paddle2.x + paddle2.width &&
                ball.y > paddle2.y &&
                ball.y < paddle2.y + paddle2.height &&
                ball.dy < 0
            ) {
                ball.dy = -ball.dy;
                ball.y = paddle2.y + paddle2.height + ball.size;
                const hitPos = (ball.x - paddle2.x) / paddle2.width - 0.5;
                ball.dx += hitPos * 3;
            }

            // Ball collision with bricks
            for (let row = 0; row < brickRows; row++) {
                for (let col = 0; col < brickCols; col++) {
                    const brick = bricks[row][col];
                    if (brick.status === 0) continue;

                    if (
                        ball.x > brick.x &&
                        ball.x < brick.x + brick.width &&
                        ball.y > brick.y &&
                        ball.y < brick.y + brick.height
                    ) {
                        brick.status = 0;
                        ball.dy = -ball.dy;
                        paddle.score += 10;
                        updateUI();

                        // Check if all bricks cleared
                        let allCleared = true;
                        for (let r = 0; r < brickRows; r++) {
                            for (let c = 0; c < brickCols; c++) {
                                if (bricks[r][c].status === 1) {
                                    allCleared = false;
                                }
                            }
                        }
                        if (allCleared) {
                            gameActive = false;
                            document.getElementById('gameStatus').textContent = '🎉 Level Complete! Score: ' + paddle.score;
                        }
                    }
                }
            }

            // Limit ball speed
            const maxSpeed = 8;
            const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
            if (currentSpeed > maxSpeed) {
                ball.dx = (ball.dx / currentSpeed) * maxSpeed;
                ball.dy = (ball.dy / currentSpeed) * maxSpeed;
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw bricks
            for (let row = 0; row < brickRows; row++) {
                for (let col = 0; col < brickCols; col++) {
                    const brick = bricks[row][col];
                    if (brick.status === 1) {
                        ctx.fillStyle = brick.color;
                        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    }
                }
            }

            // Draw paddle 1
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowColor = 'rgba(0, 255, 255, 0.5)';
            ctx.shadowBlur = 10;
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;

            // Draw paddle 2 (2P mode)
            if (paddle2) {
                ctx.fillStyle = '#ff1493';
                ctx.fillRect(paddle2.x, paddle2.y, paddle2.width, paddle2.height);
                ctx.shadowColor = 'rgba(255, 20, 147, 0.5)';
                ctx.shadowBlur = 10;
                ctx.strokeStyle = '#ff1493';
                ctx.lineWidth = 2;
                ctx.strokeRect(paddle2.x, paddle2.y, paddle2.width, paddle2.height);
                ctx.shadowBlur = 0;
            }

            // Draw ball
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();

            // Draw ball glow
            ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size + 5, 0, Math.PI * 2);
            ctx.stroke();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize
        updateUI();
        initBricks();
        gameLoop();
    </script>
</body>
</html>
